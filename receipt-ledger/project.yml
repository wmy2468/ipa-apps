name: ReceiptLedger
options:
  bundleIdPrefix: com.wmy2468
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true

settings:
  base:
    MARKETING_VERSION: "1.1"
    CURRENT_PROJECT_VERSION: "2"
    SWIFT_VERSION: "5.9"

targets:
  ReceiptLedger:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: Sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.wmy2468.receiptledger
        PRODUCT_NAME: ReceiptLedger
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: 票记
        INFOPLIST_KEY_NSCameraUsageDescription: 拍摄小票，用于自动识别金额和商户
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: 从相册选择小票照片，用于自动识别
        INFOPLIST_KEY_NSMicrophoneUsageDescription: 语音记账需要录音，用于把你的话转成记录
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: 把语音转成文字，自动填金额和分类
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UIUserInterfaceStyle: Automatic
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGN_IDENTITY: ""
        ENABLE_USER_SCRIPT_SANDBOXING: NO
