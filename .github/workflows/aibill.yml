name: aibill

on:
  push:
    branches: [ main ]
    paths:
      - 'aibill/**'
  workflow_dispatch:

concurrency:
  group: aibill-release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: aibill

    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build unsigned app
        run: |
          set -o pipefail
          xcodebuild \
            -project AIBill.xcodeproj \
            -scheme AIBill \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package IPA
        id: pkg
        run: |
          set -euo pipefail
          APP="build/Build/Products/Release-iphoneos/AIBill.app"
          test -d "$APP"
          codesign --force --deep --sign - "$APP"
          codesign -dv "$APP" 2>&1 | head -4

          VERSION=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$APP/Info.plist")
          BUILD=$(/usr/libexec/PlistBuddy -c "Print :CFBundleVersion" "$APP/Info.plist")
          NAME="AIBill-${VERSION}-${BUILD}"

          rm -rf out
          mkdir -p out/Payload
          cp -R "$APP" out/Payload/
          cd out
          zip -qry "${NAME}.ipa" Payload
          ls -lh "${NAME}.ipa"

          echo "name=${NAME}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "build=${BUILD}" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: aibill-ipa-${{ steps.pkg.outputs.version }}-${{ steps.pkg.outputs.build }}
          path: aibill/out/${{ steps.pkg.outputs.name }}.ipa
          if-no-files-found: error
          retention-days: 30

      - name: Publish to Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          NAME="${{ steps.pkg.outputs.name }}"
          VERSION="${{ steps.pkg.outputs.version }}"
          BUILD="${{ steps.pkg.outputs.build }}"
          TAG="aibill-v${VERSION}-${BUILD}"

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "out/${NAME}.ipa" --clobber
          else
            gh release create "$TAG" "out/${NAME}.ipa" \
              --title "智账 AIBill v${VERSION} (${BUILD})" \
              --notes "自动构建：$(date -u +%Y-%m-%dT%H:%M:%SZ)，提交 ${GITHUB_SHA:0:7}"
          fi
