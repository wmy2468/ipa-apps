name: qingdan

on:
  push:
    branches: [ main ]
    paths:
      - 'qingdan/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    defaults:
      run:
        working-directory: qingdan/ios

    steps:
      - uses: actions/checkout@v4

      - name: Toolchain info
        run: xcodebuild -version && sw_vers

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (unsigned)
        run: |
          set -o pipefail
          xcodebuild \
            -project Qingdan.xcodeproj \
            -scheme Qingdan \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build | tail -40

      - name: Package IPA
        run: |
          set -euo pipefail
          APP=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" | head -1)
          test -n "$APP"
          test -d "$APP"
          codesign --force --deep --sign - "$APP"
          codesign -dv "$APP" 2>&1 | head -4
          rm -rf out
          mkdir -p out/Payload
          cp -R "$APP" out/Payload/
          cd out
          zip -qry Qingdan.ipa Payload
          ls -lh Qingdan.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: qingdan-ipa
          path: qingdan/ios/out/Qingdan.ipa
          if-no-files-found: error
          retention-days: 30

      - name: Publish to Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release delete qingdan-latest --yes --cleanup-tag 2>/dev/null || true
          gh release create qingdan-latest out/Qingdan.ipa \
            --title "清单 Qingdan 最新包" \
            --notes "自动构建：$(date -u +%Y-%m-%dT%H:%M:%SZ)，提交 ${GITHUB_SHA:0:7}"
