name: receipt-ledger

on:
  push:
    branches: [ main ]
    paths:
      - 'receipt-ledger/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15-intel
    timeout-minutes: 30
    defaults:
      run:
        working-directory: receipt-ledger

    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen generate

      - name: Build (unsigned)
        run: |
          set -o pipefail
          xcodebuild \
            -project ReceiptLedger.xcodeproj \
            -scheme ReceiptLedger \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package IPA
        id: pkg
        run: |
          set -euo pipefail
          APP="build/Build/Products/Release-iphoneos/ReceiptLedger.app"
          test -d "$APP"
          codesign --force --deep --sign - "$APP"
          codesign -dv "$APP" 2>&1 | head -4

          VERSION=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$APP/Info.plist")
          BUILD=$(/usr/libexec/PlistBuddy -c "Print :CFBundleVersion" "$APP/Info.plist")
          NAME="ReceiptLedger-${VERSION}-${BUILD}"

          rm -rf out
          mkdir -p out/Payload
          cp -R "$APP" out/Payload/
          cd out
          zip -qry "${NAME}.ipa" Payload
          ls -lh "${NAME}.ipa"

          echo "name=${NAME}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "build=${BUILD}" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: receipt-ledger-ipa-${{ steps.pkg.outputs.version }}-${{ steps.pkg.outputs.build }}
          path: receipt-ledger/out/${{ steps.pkg.outputs.name }}.ipa
          if-no-files-found: error
          retention-days: 30

      - name: Publish to Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          NAME="${{ steps.pkg.outputs.name }}"
          VERSION="${{ steps.pkg.outputs.version }}"
          BUILD="${{ steps.pkg.outputs.build }}"
          TAG="receipt-ledger-v${VERSION}-${BUILD}"

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "out/${NAME}.ipa" --clobber
          else
            gh release create "$TAG" "out/${NAME}.ipa" \
              --title "票记 ReceiptLedger v${VERSION} (${BUILD})" \
              --notes "自动构建：$(date -u +%Y-%m-%dT%H:%M:%SZ)，提交 ${GITHUB_SHA:0:7}"
          fi
